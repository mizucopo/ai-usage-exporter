[project]
name = "ai-usage-exporter"
version = "0.3.0"
description = "AI usage exporter"
authors = [
    {name = "みず", email = "mizu.copo@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "python-decouple-stubs>=3.8.0.4",
    "ruff>=0.16.2",
    "taskipy>=1.14.1",
    "types-requests>=2.33.0.20260712",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W", "F",   # 基本
    "I",             # import
    "B",             # bugbear
    "SIM",           # simplify
    "C4",            # comprehension
    "ARG",           # unused args
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
mypy_path = "src:stubs"

[tool.taskipy.tasks]
check = "ruff check src tests stubs && ruff format --check src tests stubs && mypy && pytest"
fix = "ruff check --fix src tests stubs && ruff format src tests stubs"
test = "task check"


[tool.uv]
package = false
