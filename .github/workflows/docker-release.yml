name: Docker Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      publish: ${{ steps.prepare.outputs.publish || 'false' }}
      release_sha: ${{ steps.prepare.outputs.release_sha }}
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      rust_matrix: ${{ steps.rust-matrix.outputs.rust_matrix }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: Validate release branch
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo '::error::Release requires main. Select the main branch when running this workflow manually.'
            exit 1
          fi
      - name: Checkout control code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Number latest main and reserve its tag
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: "\u307f\u305a"
          GIT_AUTHOR_EMAIL: "mizu.copo@gmail.com"
          GIT_COMMITTER_NAME: "\u307f\u305a"
          GIT_COMMITTER_EMAIL: "mizu.copo@gmail.com"

          DOCKERHUB_USERNAME: "mizucopo"
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 -I .github/scripts/release.py prepare

      - name: Checkout numbering commit for Rust targets
        if: steps.prepare.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.prepare.outputs.release_sha }}
          fetch-depth: 0
      - name: Read Rust targets from numbering commit
        id: rust-matrix
        if: steps.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.prepare.outputs.release_sha }}
        run: python3 -I .github/scripts/release.py rust-matrix

  rust-builds:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.rust_matrix) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      RUST_RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout numbering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
      - name: Set up Python for Rust packaging
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install Rust toolchain
        run: rustup show
      - name: Build, archive and smoke Rust distribution
        env:
          RUST_RELEASE_DIR: ${{ runner.temp }}/rust-release
          GH_TOKEN: ${{ github.token }}
        run: python -I .github/scripts/release.py rust-build
      - name: Verify packaged exporter with mock Codex
        env:
          RUST_RELEASE_DIR: ${{ runner.temp }}/rust-release
        run: python -I tests/release_smoke.py --target "$RUST_RELEASE_TARGET" --output "$RUST_RELEASE_DIR" --verify-existing
      - name: Retain verified Rust distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ format('rust-release-{0}', matrix.target) }}
          path: ${{ runner.temp }}/rust-release/${{ matrix.target }}
          if-no-files-found: error
          overwrite: true

  release:
    needs: [prepare, rust-builds]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}
      has_latest_image: ${{ steps.metadata.outputs.has_latest_image }}
    env:
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      DOCKERHUB_USERNAME: "mizucopo"
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout numbering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0

      - name: Verify numbering commit and read publication data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export RELEASE_PLAN_OUTPUT="$RUNNER_TEMP/release-plan.json"
          printf 'RELEASE_PLAN_OUTPUT=%s\n' "$RELEASE_PLAN_OUTPUT" >> "$GITHUB_ENV"
          python3 -I .github/scripts/release.py plan
      - name: Install Rust toolchain
        run: rustup show
      - name: Validate Rust release
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          cargo build --release --locked

      - name: Inspect versioned image
        id: image-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/release.py image-state
      - name: Classify release version
        id: metadata
        run: |
          is_prerelease="$(jq -er '.publication.is_prerelease | select(type == "boolean") | tostring' "$RELEASE_PLAN_OUTPUT")"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          has_latest_image="$(jq -er '.publication.latest_image != null | tostring' "$RELEASE_PLAN_OUTPUT")"
          echo "has_latest_image=$has_latest_image" >> "$GITHUB_OUTPUT"
      - name: Inspect GitHub Release
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          INSPECT_DRAFT_RELEASES: "true"
        run: |
          set -euo pipefail

          git fetch --force --tags

          HEAD_SHA="$(git rev-parse HEAD)"
          tag_exists=false
          release_exists=false
          release_asset_exists=false
          release_is_draft=false
          release_id=

          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            TAG_SHA="$(git rev-list -n 1 "refs/tags/$TAG")"
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "::error::Tag $TAG already points to $TAG_SHA, not $HEAD_SHA."
              exit 1
            fi
            tag_exists=true
          fi

          RELEASE_RESPONSE="$(mktemp)"
          trap 'rm -f "$RELEASE_RESPONSE"' EXIT

          set +e
          RELEASE_HTTP_STATUS="$(
            curl --silent --show-error --location \
              --output "$RELEASE_RESPONSE" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG"
          )"
          CURL_STATUS=$?
          set -e

          if [ "$CURL_STATUS" -ne 0 ]; then
            echo "::error::Could not inspect GitHub Release $TAG."
            exit "$CURL_STATUS"
          fi

          case "$RELEASE_HTTP_STATUS" in
            200)
              release_exists=true
              ;;
            404)
              ;;
            *)
              echo "::error::Could not inspect GitHub Release $TAG: HTTP $RELEASE_HTTP_STATUS."
              exit 1
              ;;
          esac

          if [ "${INSPECT_DRAFT_RELEASES:-false}" = "true" ]; then
            # The tag endpoint returns published releases only. Always include every page
            # of the authenticated listing to detect drafts and duplicate matching tags.
            if ! gh api --paginate --slurp \
              "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | jq --arg tag "$TAG" \
                '[.[][] | select(.tag_name == $tag)] |
                 if length == 0 then null
                 elif length == 1 then .[0]
                 else error("Multiple GitHub Releases match the tag") end' \
                > "$RELEASE_RESPONSE"; then
              echo "::error::Could not inspect draft GitHub Releases for $TAG."
              exit 1
            fi
            if [ -n "${RELEASE_ID:-}" ]; then
              if ! [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]] \
                || ! jq -e --argjson id "$RELEASE_ID" \
                  '. == null or .id == $id' "$RELEASE_RESPONSE" > /dev/null; then
                echo "::error::Listed GitHub Release differs from retained ID."
                exit 1
              fi
              gh api "/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RELEASE_RESPONSE"
              if ! jq -e --argjson id "$RELEASE_ID" '.id == $id' "$RELEASE_RESPONSE" > /dev/null; then
                echo "::error::GitHub Release ID differs from retained ID."
                exit 1
              fi
            fi
            if [ "$(jq -r '. != null' "$RELEASE_RESPONSE")" = "true" ]; then
              release_exists=true
            fi

            if [ "$release_exists" = "true" ]; then
              if ! release_id="$(jq -er '.id | select(type == "number" and . > 0 and floor == .)' "$RELEASE_RESPONSE")" \
                || ! release_is_draft="$(jq -er '.draft | select(type == "boolean") | tostring' "$RELEASE_RESPONSE")" \
                || ! jq -e --arg tag "$TAG" '.tag_name == $tag and (.assets | type == "array")' "$RELEASE_RESPONSE" > /dev/null; then
                echo "::error::GitHub Release $TAG returned invalid release metadata."
                exit 1
              fi
              if [ "$release_is_draft" = "false" ]; then
                if ! planned_prerelease="$(jq -er '.publication.is_prerelease | select(type == "boolean") | tostring' "${RELEASE_PLAN_OUTPUT:-}")" \
                  || ! jq -e --argjson prerelease "$planned_prerelease" \
                    '(.prerelease | type == "boolean") and .prerelease == $prerelease' \
                    "$RELEASE_RESPONSE" > /dev/null; then
                  echo "::error::Published GitHub Release classification differs from publication plan."
                  exit 1
                fi
              fi
            fi
          fi

          if [ "$release_exists" = "true" ] && [ "$tag_exists" != "true" ]; then
            echo "::error::GitHub Release $TAG exists, but the matching git tag was not found."
            exit 1
          fi

          if [ -n "${RELEASE_ASSET_NAME:-}" ] && [ -n "${RELEASE_ASSET_NAMES:-}" ]; then
            echo "::error::Specify only one release asset input."
            exit 1
          fi

          if [ "$release_exists" = "true" ] && [ -n "${RELEASE_ASSET_NAME:-}${RELEASE_ASSET_NAMES:-}" ]; then
            if [ -n "${RELEASE_ASSET_NAMES:-}" ]; then
              IFS='|' read -r -a expected_assets <<< "$RELEASE_ASSET_NAMES"
            else
              expected_assets=("$RELEASE_ASSET_NAME")
            fi
            release_asset_exists=true
            for asset_name in "${expected_assets[@]}"; do
              if [ -z "$asset_name" ]; then
                echo "::error::Release asset name must not be empty."
                exit 1
              fi
              if ! asset_exists="$(
                jq -r --arg name "$asset_name" \
                  --argjson require_uploaded "${INSPECT_DRAFT_RELEASES:-false}" \
                  'any(.assets[]?; .name == $name and
                    ($require_uploaded == false or
                     (.state == "uploaded" and (.size | type == "number" and . > 0))))' \
                  "$RELEASE_RESPONSE"
              )"; then
                echo "::error::Could not inspect assets for GitHub Release $TAG."
                exit 1
              fi
              case "$asset_exists" in
                true) ;;
                false) release_asset_exists=false ;;
                *)
                  echo "::error::GitHub Release $TAG returned an invalid asset state."
                  exit 1
                  ;;
              esac
            done
          fi

          {
            echo "tag_exists=$tag_exists"
            echo "release_exists=$release_exists"
            echo "release_asset_exists=$release_asset_exists"
            if [ "${INSPECT_DRAFT_RELEASES:-false}" = "true" ]; then
              echo "release_is_draft=$release_is_draft"
              echo "release_id=$release_id"
            fi
          } >> "$GITHUB_OUTPUT"
      - name: Reject incomplete public release
        if: steps.release-state.outputs.release_exists == 'true' && steps.release-state.outputs.release_is_draft != 'true' && steps.image-state.outputs.version_exists != 'true'
        run: |
          echo '::error::Published versioned image is missing; refusing to overwrite the release.'
          exit 1
      - name: Verify existing image ownership
        if: steps.image-state.outputs.version_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.image-state.outputs.image_tag }}
        run: bash .github/scripts/manage-docker-image-owner.sh verify "$TAG"
      - name: Build and validate native image
        if: steps.image-state.outputs.version_exists != 'true'
        run: |
          docker build --check .
          docker build -t release-check .

      - name: Set up QEMU
        if: steps.image-state.outputs.version_exists != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.image-state.outputs.version_exists != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        if: steps.image-state.outputs.version_exists != 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: "mizucopo"
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Reserve image ownership
        if: steps.image-state.outputs.version_exists != 'true'
        env:
          TAG: ${{ steps.image-state.outputs.image_tag }}
        run: bash .github/scripts/manage-docker-image-owner.sh record "$TAG"
      - name: Build and push immutable image
        if: steps.image-state.outputs.version_exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: "linux/amd64,linux/arm64"
          tags: mizucopo/ai-usage-exporter:${{ steps.image-state.outputs.image_tag }}
      - name: Verify published image
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/release.py image-verify
      - name: Create GitHub Release
        id: create-release
        if: steps.release-state.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          IS_PRERELEASE: ${{ steps.metadata.outputs.is_prerelease }}
          RELEASE_DRAFT: "true"
        run: python3 -I .github/scripts/release.py create

      - name: Download verified Rust distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rust-release-*
          path: ${{ runner.temp }}/rust-release
      - name: Add release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.create-release.outputs.release_id || steps.release-state.outputs.release_id }}

          BUILD_RUST_BINARY: "true"
          RUST_RELEASE_DIR: ${{ runner.temp }}/rust-release
        run: python3 -I .github/scripts/release.py distribution

  promote-latest:
    needs: [prepare, release]
    if: needs.prepare.outputs.publish == 'true' && needs.release.outputs.is_prerelease == 'false' && needs.release.outputs.has_latest_image == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
    steps:
      - name: Checkout numbering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0

      - name: Verify numbering commit and read publication data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export RELEASE_PLAN_OUTPUT="$RUNNER_TEMP/release-plan.json"
          printf 'RELEASE_PLAN_OUTPUT=%s\n' "$RELEASE_PLAN_OUTPUT" >> "$GITHUB_ENV"
          python3 -I .github/scripts/release.py plan

      - name: Check newest completed release
        id: latest-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/release.py latest
      - name: Set up Docker Buildx
        if: steps.latest-state.outputs.promote_latest == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        if: steps.latest-state.outputs.promote_latest == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: "mizucopo"
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish latest image
        if: steps.latest-state.outputs.promote_latest == 'true'
        env:
          IMAGE_REPOSITORY: "mizucopo/ai-usage-exporter"
          TAG: ${{ steps.latest-state.outputs.image_tag }}
        run: docker buildx imagetools create --prefer-index=false --tag "$IMAGE_REPOSITORY:latest" "$IMAGE_REPOSITORY:$TAG"
      - name: Mark GitHub Release as latest
        if: steps.latest-state.outputs.promote_latest == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.latest-state.outputs.release_tag }}
        run: gh release edit "$TAG" --latest

  cleanup-image-owners:
    needs: [prepare, release, promote-latest]
    if: ${{ !cancelled() && needs.prepare.outputs.publish == 'true' && needs.release.result == 'success' && (needs.promote-latest.result == 'success' || needs.promote-latest.result == 'skipped') }}
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      DOCKERHUB_USERNAME: "mizucopo"
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout numbering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0

      - name: Verify numbering commit and read publication data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export RELEASE_PLAN_OUTPUT="$RUNNER_TEMP/release-plan.json"
          printf 'RELEASE_PLAN_OUTPUT=%s\n' "$RELEASE_PLAN_OUTPUT" >> "$GITHUB_ENV"
          python3 -I .github/scripts/release.py plan

      - name: Download verified Rust distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rust-release-*
          path: ${{ runner.temp }}/rust-release
      - name: Retain image digests and remove completed ownership markers
        env:
          GH_TOKEN: ${{ github.token }}
          RUST_RELEASE_DIR: ${{ runner.temp }}/rust-release
        run: python3 -I .github/scripts/release.py image-owner-complete
